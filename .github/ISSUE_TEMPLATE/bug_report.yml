name: Bug report
description: Something's broken
title: "[bug] "
labels: [bug, tester-feedback]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Axis-AI. Fill in what you can — partial reports are better than no reports.

  - type: input
    id: version
    attributes:
      label: Axis-AI version
      description: Settings → Diagnostics shows this
      placeholder: e.g. v0.1.2-alpha
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows 10
        - Windows 11
        - Linux (Ubuntu/Debian)
        - Linux (other)
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Step-by-step if possible. Include any error messages.
      placeholder: |
        1. Opened Lab page
        2. Clicked "New task"
        3. Got error: ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: e.g. The task should have been created and visible in the list.

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics (paste from Settings → Diagnostics → Copy)
      description: Settings → Diagnostics → "Copy diagnostics" — paste the result here
      render: text